[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "folderpilot"
version = "0.1.0"
description = "通用文件夹差异检测与安全管理工具"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[tool.setuptools.packages.find]
include = ["folderpilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
